# This workflow will do a clean installation of node dependencies, cache/restore them, build the 
# source code and run tests across different versions of node
# For more information see: 
# https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build and Deploy

on:
  push:
    branches: [main, vue3-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Copy data files to public directory
      run: |
        cp config.json public/
        mkdir -p public/clawer
        cp clawer/all_course_list.json public/clawer/
      
    - name: Build project
      run: npm run build
      
    - name: Copy index.html to 404.html for SPA routing
      run: cp dist/index.html dist/404.html
      
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        cname: ntpu-timetable.littlechin.tw