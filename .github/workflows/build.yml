# This workflow will do a clean installation of node dependencies, cache/restore them, build the
# source code and run tests across different versions of node
# For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # 移除 cache 設定，因為沒有 lock 文件
          # cache: 'npm'

      - name: Clean npm config
        run: npm config delete registry || true
      
      - name: Set npm registry to official
        run: npm config set registry https://registry.npmjs.org/
      
      - name: Install dependencies
        run: |
          # 如果有 node 18+ 就用完整版，否則用相容版
          if node --version | grep -E '^v1[2-7]\.'; then
            echo "Using Node.js 12-17, using compatible package.json"
            cp package.node12.json package.json
          fi
          npm install --legacy-peer-deps

      - name: Build with Vite
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: GH Pages deploy
        uses: Cecilapp/GitHub-Pages-deploy@3.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A verified email.
          email: ${{ secrets.EMAIL }}
          # Where static files are.
          build_dir: dist
          branch: gh-pages
          cname: ntpu-timetable.littlechin.tw
